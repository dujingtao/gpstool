org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8 -Dhttp.keepAlive=false -Dhttps.keepAlive=false -Dhttps.protocols=TLSv1.2,TLSv1.3
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# Disable HTTP keep-alive to prevent SSL peer shut down prematurely on reused connections
systemProp.http.keepAlive=false
systemProp.https.keepAlive=false
systemProp.https.protocols=TLSv1.2,TLSv1.3
